# Install: pip install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format OpenPointCloud.slnx --verify-no-changes
        language: system
        pass_filenames: false
        files: \.(cs|csproj|slnx|editorconfig)$
      - id: conventional-commit
        name: lowercase conventional commit message
        language: pygrep
        entry: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9][^A-Z]*$'
        args: [--negate]
        stages: [commit-msg]
